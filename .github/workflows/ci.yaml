name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:  
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Docker Image bauen
        run: docker build -t devnext .

      - name: Docker Container testen
        run: |
          docker run -d --name devnext-ci -p 3000:3000 devnext
          sleep 2
          curl --fail http://localhost:3000

      - name: Bei Container Registry anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker Image veröffentlichen
        run: |
          docker tag devnext ghcr.io/${{ github.repository_owner }}/devnext:latest
          docker push ghcr.io/${{ github.repository_owner }}/devnext:latest
